  <text x="20" y="230" font-family="sans-serif" font-size="14" transform="rotate(-90 20 230)">Rθ [px]</text>
  <text x="132" y="290" font-family="sans-serif" font-size="13">113.23</text><text x="277" y="235" font-family="sans-serif" font-size="13">115.97</text><text x="422" y="175" font-family="sans-serif" font-size="13">118.88</text><text x="567" y="110" font-family="sans-serif" font-size="13">121.97</text><text x="650" y="78" font-family="sans-serif" font-size="13">125.23</text>
  <text x="105" y="92" font-family="sans-serif" font-size="14" fill="#555">A one-pixel y0 error changes the fitted Rθ by about 3 px around the working reference.</text>
