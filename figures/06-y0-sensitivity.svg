  <text x="25" y="52" font-family="sans-serif" font-size="14" fill="#555">Demonstration at zmax = 100 px on frame_046.</text>
  <line x1="90" y1="335" x2="750" y2="335" stroke="#222"/>
  <line x1="90" y1="70" x2="90" y2="335" stroke="#222"/>
  <polyline fill="none" stroke="#111" stroke-width="2.5" points="120,300 265,245 410,185 555,120 700,52"/>
  <g fill="#111"><circle cx="120" cy="300" r="5"/><circle cx="265" cy="245" r="5"/><circle cx="410" cy="185" r="6"/><circle cx="555" cy="120" r="5"/><circle cx="700" cy="52" r="5"/></g>
  <line x1="410" y1="70" x2="410" y2="335" stroke="#777" stroke-dasharray="7 5"/>
  <text x="382" y="360" font-family="sans-serif" font-size="13">775</text><text x="94" y="360" font-family="sans-serif" font-size="13">773</text><text x="240" y="360" font-family="sans-serif" font-size="13">774</text><text x="530" y="360" font-family="sans-serif" font-size="13">776</text><text x="675" y="360" font-family="sans-serif" font-size="13">777</text>
