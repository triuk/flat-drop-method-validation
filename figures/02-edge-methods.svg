  <rect x="315" y="232" width="34" height="158" fill="#111"/><rect x="354" y="278" width="34" height="112" fill="#777"/>
  <rect x="495" y="230" width="34" height="160" fill="#555"/><rect x="534" y="268" width="34" height="122" fill="#aaa"/>
